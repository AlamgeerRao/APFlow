name: AP Flow CI/CD (Development)

# WP-022 — Development-only pipeline. There is no staging/prod target yet
# (per 01_Project_Context.md — dev-only per this WP's own scope), so this
# workflow deliberately has no environment parameter/matrix that could ever
# point migrations or deployments anywhere else. Every target (SQL server,
# database, both App Services) is hardcoded to the single "development"
# GitHub Environment's variables below — see docs/CI-CD-Pipeline.md for why.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ap-flow-dev-deploy
  cancel-in-progress: false

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '24.x'   # wp-060: bumped from 20.x (EOL 2026-04-30) to Active LTS
  SOLUTION_PATH: 'APFlow.sln'
  API_PROJECT_PATH: 'src/APFlow.Api/APFlow.Api.csproj'
  INFRASTRUCTURE_PROJECT_PATH: 'src/APFlow.Infrastructure/APFlow.Infrastructure.csproj'
  WEB_APP_PATH: 'src/APFlow.Web'

jobs:
  # ============================================================================
  # Backend: build .NET solution, run all 5 test projects
  # ============================================================================
  backend-build-test:
    name: Backend build & test (${{ matrix.test-project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-project:
          - tests/APFlow.Domain.Tests
          - tests/APFlow.Application.Tests
          - tests/APFlow.Api.Tests
          - tests/APFlow.Infrastructure.Tests
          - tests/APFlow.Integrations.Tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore solution
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Build solution (Release, no restore)
        # Only needs to run once per matrix entry in principle, but is cheap
        # and keeps every matrix leg self-contained/independent — deliberate,
        # not an oversight.
        run: dotnet build "${{ env.SOLUTION_PATH }}" --configuration Release --no-restore

      - name: Run tests — ${{ matrix.test-project }}
        run: dotnet test "${{ matrix.test-project }}" --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ strategy.job-index }}
          path: '**/test-results.trx'
          retention-days: 14

  # ============================================================================
  # Backend: publish the API for deployment (separate from test matrix so a
  # single publish artifact exists regardless of matrix fan-out)
  # ============================================================================
  backend-publish:
    name: Publish APFlow.Api
    runs-on: ubuntu-latest
    needs: [backend-build-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Publish APFlow.Api
        run: dotnet publish "${{ env.API_PROJECT_PATH }}" --configuration Release --no-restore --output ./publish/api

      - name: Upload API publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish/api
          retention-days: 14

  # ============================================================================
  # Frontend: build, lint, type-check, unit test (all added WP-014a)
  # ============================================================================
  frontend-build-test:
    name: Frontend build & test (APFlow.Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WEB_APP_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WEB_APP_PATH }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint .)
        run: npx eslint .

      - name: Type-check (tsc -b)
        run: npx tsc -b

      - name: Unit tests (vitest run)
        run: npx vitest run

      # VITE_*-prefixed variables are compiled into the bundle by `vite build`
      # itself - there is no later point where they can be injected (unlike
      # the API's app settings, which .NET reads at runtime). Missing any of
      # the three msalConfig.ts actually requires (VITE_ENTRA_CLIENT_ID,
      # VITE_ENTRA_AUTHORITY, VITE_API_SCOPE) produces a real, user-visible
      # "MSAL initialization failed" error in the browser, confirmed live
      # 2026-07-31 after the Oryx/server.js fix let the app itself finally
      # load. VITE_API_BASE_URL (required by httpClient.ts, not wrapped in
      # msalConfig.ts's own throw-if-missing check) is constructed here
      # rather than stored as its own variable, so it can't drift from
      # API_APP_SERVICE_NAME. VITE_ENTRA_REDIRECT_URI is deliberately left
      # unset - it defaults to the page's own origin, which already matches
      # the redirect URI registered on the SPA app registration (confirmed
      # live via `az ad app show`).
      - name: Build production bundle
        env:
          VITE_ENTRA_CLIENT_ID: ${{ vars.ENTRA_SPA_CLIENT_ID }}
          VITE_ENTRA_AUTHORITY: ${{ vars.ENTRA_AUTHORITY }}
          VITE_API_SCOPE: ${{ vars.ENTRA_API_SCOPE }}
          API_APP_SERVICE_NAME: ${{ vars.API_APP_SERVICE_NAME }}
          VITE_API_BASE_URL: https://${{ vars.API_APP_SERVICE_NAME }}.azurewebsites.net
        run: |
          # Checked separately from VITE_API_BASE_URL below: that variable is
          # always non-empty (it has literal https://.../azurewebsites.net
          # around the substitution), so an empty API_APP_SERVICE_NAME would
          # otherwise silently produce "https://.azurewebsites.net" instead
          # of failing loudly here.
          for v in VITE_ENTRA_CLIENT_ID VITE_ENTRA_AUTHORITY VITE_API_SCOPE API_APP_SERVICE_NAME; do
            if [ -z "${!v}" ]; then
              echo "::error::Required GitHub Environment variable for '$v' is empty or not set on the 'development' environment (see docs/CI-CD-Pipeline.md)."
              exit 1
            fi
          done
          npm run build

      # Prunes devDependencies (typescript, vite, eslint, vitest, etc.) down
      # to just runtime deps (express) so the artifact below can ship a
      # working node_modules directly, instead of relying on Azure's Oryx
      # build step to install them post-deploy. Oryx was tried first
      # (SCM_DO_BUILD_DURING_DEPLOYMENT=true) and failed: Oryx auto-runs
      # package.json's "build" script whenever one exists, so it re-ran
      # `tsc -b && vite build` against this artifact - which ships only the
      # already-built dist/, not tsconfig.json or src/ - producing
      # "TS5083: Cannot read file 'tsconfig.json'" and failing the deploy.
      # Running the real build in CI (above, with full source/devDeps
      # present) and shipping only the result removes that dependency on
      # Oryx correctly detecting/skipping this app's build step.
      - name: Install production-only dependencies for deployment
        run: npm ci --omit=dev

      - name: Upload web publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-publish
          # Includes src/APFlow.Web/server.js, the small Express static-file
          # server with SPA fallback that Azure App Service actually runs
          # (via resources.bicep's appCommandLine: 'node server.js' —
          # APFlow.Web runs NODE|24-lts on App Service, not Static Web Apps;
          # see infra/README.md "What changed in wp-060" for the Node 20 EOL
          # bump). node_modules ships pre-installed (production deps only,
          # see the step above) - resources.bicep sets
          # SCM_DO_BUILD_DURING_DEPLOYMENT=false so Azure does a plain zip
          # deploy of exactly this artifact with no Oryx build step at all.
          path: |
            ${{ env.WEB_APP_PATH }}/dist
            ${{ env.WEB_APP_PATH }}/server.js
            ${{ env.WEB_APP_PATH }}/package.json
            ${{ env.WEB_APP_PATH }}/package-lock.json
            ${{ env.WEB_APP_PATH }}/node_modules
          retention-days: 14

  # ============================================================================
  # Apply pending EF Core migrations to Development ONLY — explicit, auditable
  # step, gated behind the "development" GitHub Environment, and only reached
  # if every build/test job above succeeded.
  # ============================================================================
  migrate-development-database:
    name: Apply EF Core migrations (Development)
    runs-on: ubuntu-latest
    needs: [backend-publish, frontend-build-test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: development
    permissions:
      id-token: write   # required for OIDC login to Azure — no stored client secret
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      # --- OIDC federated login: no client secret is stored anywhere. -------
      # This exchanges GitHub's own OIDC ID token for an Azure AD token using
      # the CI/CD app registration's federated credential (see
      # scripts/setup-github-oidc-service-principal.sh). Writing the raw
      # GitHub token to a file and pointing AZURE_FEDERATED_TOKEN_FILE at it
      # is the documented mechanism Azure.Identity's WorkloadIdentityCredential
      # (used by "Authentication=Active Directory Default" below) expects.
      # NOT YET CONFIRMED as of 2026-07-31: reaching a later step in a real
      # run does not by itself prove this exchange succeeds - the migration
      # step's own errors seen so far (a local build-time check, then a
      # network-layer SQL firewall failure) both occur independent of
      # whether this token exchange/the AAD app itself is valid. Separately
      # confirmed (as tenant Global Administrator) that the CI/CD app
      # registration this depends on may not exist yet - see
      # docs/CI-CD-Pipeline.md's post-wp-060 note before assuming this works.
      - name: Request GitHub OIDC token for Azure AD federation
        id: oidc
        run: |
          TOKEN_RESPONSE=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange")
          echo "$TOKEN_RESPONSE" | jq -r '.value' > "$RUNNER_TEMP/azure_federated_token"
          echo "token_file=$RUNNER_TEMP/azure_federated_token" >> "$GITHUB_OUTPUT"

      # --- Temporary SQL firewall rule for this runner's ephemeral IP. ------
      # GitHub-hosted runners have no static/predictable IP and are NOT
      # covered by Azure SQL's "Allow Azure services" rule (that rule only
      # covers Azure's own trusted PaaS-to-PaaS traffic, not arbitrary
      # internet hosts, even ones physically running on Azure). Without this,
      # "dotnet ef database update" fails with SqlException error 40 ("Could
      # not open a connection to SQL Server") regardless of how the
      # connection authenticates - this is a network/firewall problem, not a
      # credentials problem. The rule is scoped to exactly this run's IP and
      # removed unconditionally afterward (see the cleanup step below), so no
      # standing firewall exception is left behind between runs. Requires the
      # CI service principal to hold a role covering
      # Microsoft.Sql/servers/firewallRules/* on the SQL server resource
      # (e.g. "SQL Server Contributor", scoped to just that one resource) -
      # see setup-github-oidc-service-principal.sh step 4.
      - name: Azure login (OIDC — no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.CI_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Add temporary SQL firewall rule for this runner
        id: sql-firewall
        run: |
          # Root cause found live (2026-07-31): vars.SQL_SERVER_FQDN was
          # simply not set in the "development" GitHub Environment - proven
          # by the DEBUG echoes below showing it empty while RESOURCE_GROUP/
          # AZURE_SUBSCRIPTION_ID (resolved the identical way, in the same
          # step) were both populated correctly. Not a workflow bug, not an
          # Azure CLI bug (both were seriously, wrongly suspected first) -
          # just a missing variable, silently producing a malformed resource
          # ID (empty server-name segment) instead of an obvious error. The
          # explicit check below now fails loudly and immediately on this
          # exact class of problem instead of letting it surface three
          # layers removed as a confusing Azure error.
          for v in SQL_SERVER_FQDN RESOURCE_GROUP AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Required GitHub Environment variable '$v' is empty or not set on the 'development' environment."
              exit 1
            fi
          done
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "Runner public IP: $RUNNER_IP"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          SQL_SERVER_NAME="${SQL_SERVER_FQDN%%.*}"
          echo "sql_server_name=$SQL_SERVER_NAME" >> "$GITHUB_OUTPUT"
          FIREWALL_RULE_URL="https://management.azure.com/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Sql/servers/${SQL_SERVER_NAME}/firewallRules/gha-run-${{ github.run_id }}?api-version=2021-11-01"
          az rest --method put \
            --url "$FIREWALL_RULE_URL" \
            --body "{\"properties\":{\"startIpAddress\":\"${RUNNER_IP}\",\"endIpAddress\":\"${RUNNER_IP}\"}}"
        env:
          SQL_SERVER_FQDN: ${{ vars.SQL_SERVER_FQDN }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Apply pending migrations
        env:
          AZURE_CLIENT_ID: ${{ vars.CI_AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_FEDERATED_TOKEN_FILE: ${{ steps.oidc.outputs.token_file }}
          AZURE_AUTHORITY_HOST: https://login.microsoftonline.com
          SQL_SERVER_FQDN: ${{ vars.SQL_SERVER_FQDN }}
          SQL_DATABASE_NAME: ${{ vars.SQL_DATABASE_NAME }}
        run: |
          # Same missing-variable failure mode as the firewall-rule step
          # above is possible here too (both consume vars.SQL_SERVER_FQDN) -
          # fail loudly rather than attempt a connection with an empty
          # Server=tcp:,1433;... string.
          for v in SQL_SERVER_FQDN SQL_DATABASE_NAME; do
            if [ -z "${!v}" ]; then
              echo "::error::Required GitHub Environment variable '$v' is empty or not set on the 'development' environment."
              exit 1
            fi
          done
          dotnet ef database update \
            --project "${{ env.INFRASTRUCTURE_PROJECT_PATH }}" \
            --startup-project "${{ env.API_PROJECT_PATH }}" \
            --connection "Server=tcp:${{ vars.SQL_SERVER_FQDN }},1433;Initial Catalog=${{ vars.SQL_DATABASE_NAME }};Authentication=Active Directory Default;Encrypt=True;TrustServerCertificate=False;"

      - name: Remove temporary SQL firewall rule
        if: always()
        run: |
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az rest --method delete \
            --url "https://management.azure.com/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Sql/servers/${{ steps.sql-firewall.outputs.sql_server_name }}/firewallRules/gha-run-${{ github.run_id }}?api-version=2021-11-01" \
            || echo "Firewall rule already absent or removal failed - not fatal, but check for a stale rule."
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  # ============================================================================
  # Deploy — API (only after migrations succeed)
  # ============================================================================
  deploy-api:
    name: Deploy APFlow.Api (Development)
    runs-on: ubuntu-latest
    needs: [migrate-development-database]
    environment:
      name: development
      url: https://app-apflow-dev-api-ryd3y6fyfloxu.azurewebsites.net
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download API publish artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./publish/api

      - name: Verify required variables are set
        run: |
          if [ -z "${{ vars.API_APP_SERVICE_NAME }}" ]; then
            echo "::error::Required GitHub Environment variable 'API_APP_SERVICE_NAME' is empty or not set on the 'development' environment."
            exit 1
          fi

      - name: Azure login (OIDC — no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.CI_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.API_APP_SERVICE_NAME }}
          package: ./publish/api

  # ============================================================================
  # Deploy — Web (only after migrations succeed; independent of deploy-api,
  # both gated on the same migration step)
  # ============================================================================
  deploy-web:
    name: Deploy APFlow.Web (Development)
    runs-on: ubuntu-latest
    needs: [migrate-development-database]
    environment:
      name: development
      url: https://app-apflow-dev-web-ryd3y6fyfloxu.azurewebsites.net
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download web publish artifact
        uses: actions/download-artifact@v4
        with:
          name: web-publish
          path: ./publish/web

      - name: Verify required variables are set
        run: |
          if [ -z "${{ vars.WEB_APP_SERVICE_NAME }}" ]; then
            echo "::error::Required GitHub Environment variable 'WEB_APP_SERVICE_NAME' is empty or not set on the 'development' environment."
            exit 1
          fi

      - name: Azure login (OIDC — no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.CI_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.WEB_APP_SERVICE_NAME }}
          package: ./publish/web
